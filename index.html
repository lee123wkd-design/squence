<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Our Special Day</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        /* =========================
           스와이프 영역
        ========================= */

        .slider {

            width: 100vw;
            height: 100dvh;

            display: flex;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;

            scroll-behavior: smooth;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: none;
        }


        .slider::-webkit-scrollbar {
            display: none;
        }


        /* =========================
           각각의 페이지
        ========================= */

        .page {

            /*
             * 처음에는 모든 페이지를 만들어 두지만
             * 공개되지 않은 페이지는 숨긴다.
             */

            flex: 0 0 100vw;

            width: 100vw;
            height: 100dvh;

            scroll-snap-align: start;

            scroll-snap-stop: always;

            display: none;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /*
         * 공개된 페이지
         */

        .page.visible {

            display: flex;
        }


        /* =========================
           이미지
        ========================= */

        .page img {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            object-position: center center;
        }


        /* =========================
           페이지 표시 점
        ========================= */

        .dots {

            position: fixed;

            left: 50%;

            bottom:
                calc(
                    25px +
                    env(safe-area-inset-bottom)
                );

            transform: translateX(-50%);

            display: flex;

            gap: 8px;

            z-index: 100;
        }


        .dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.4);

            transition:
                transform 0.3s ease,
                background 0.3s ease;
        }


        .dot.active {

            background: white;

            transform: scale(1.3);
        }


        /* =========================
           아이폰 세로 화면
        ========================= */

        @media screen
        and (max-width: 500px)
        and (orientation: portrait) {

            .page img {

                width: 100vw;
                height: 100dvh;

                object-fit: contain;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         스와이프 영역
    ================================== -->

    <main
        class="slider"
        id="slider">


        <!-- 1 -->
        <section class="page">

            <img
                src="Sqn_1.jpg"
                alt="Page 1">

        </section>


        <!-- 2 -->
        <section class="page">

            <img
                src="Sqn_2.jpg"
                alt="Page 2">

        </section>


        <!-- 3 -->
        <section class="page">

            <img
                src="Sqn_3.jpg"
                alt="Page 3">

        </section>


        <!-- 4 -->
        <section class="page">

            <img
                src="Sqn_4.jpg"
                alt="Page 4">

        </section>


        <!-- 5 -->
        <section class="page">

            <img
                src="Sqn_5.jpg"
                alt="Page 5">

        </section>


        <!-- 6 -->
        <section class="page">

            <img
                src="Sqn_6.jpg"
                alt="Page 6">

        </section>


        <!-- 7 -->
        <section class="page">

            <img
                src="Sqn_7.jpg"
                alt="Page 7">

        </section>


    </main>


    <!-- =================================
         페이지 표시 점
    ================================== -->

    <div
        class="dots"
        id="dots">

        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

    </div>


    <script>


        /* =================================================
           설정
        ================================================= */


        /*
         * 모든 시간은 한국시간(KST)
         *
         * 2026년 8월 1일
         */

        const schedules = [

            {
                image: "Sqn_1.jpg",

                time:
                    "2026-07-29T00:00:00+09:00"
            },

            {
                image: "Sqn_2.jpg",

                time:
                    "2026-07-29T10:00:00+09:00"
            },

            {
                image: "Sqn_3.jpg",

                time:
                    "2026-07-29T11:00:00+09:00"
            },

            {
                image: "Sqn_4.jpg",

                time:
                    "2026-07-29T12:00:00+09:00"
            },

            {
                image: "Sqn_5.jpg",

                time:
                    "2026-07-29T13:00:00+09:00"
            },

            {
                image: "Sqn_6.jpg",

                time:
                    "2026-07-29T14:00:00+09:00"
            },

            {
                image: "Sqn_7.jpg",

                time:
                    "2026-07-29T15:00:00+09:00"
            }

        ];


        /* =================================================
           HTML 요소
        ================================================= */

        const slider =
            document.getElementById(
                "slider"
            );


        const pages =
            document.querySelectorAll(
                ".page"
            );


        const dots =
            document.querySelectorAll(
                ".dot"
            );


        /* =================================================
           이미지 미리 로딩
        ================================================= */

        /*
         * 아직 공개되지 않은 이미지도
         * 미리 로딩해 둔다.
         *
         * 실제 공개 순간에 이미지 로딩을
         * 기다리지 않도록 하기 위함.
         */

        schedules.forEach(
            function(item) {

                const image =
                    new Image();

                image.src =
                    item.image;

            }
        );


        /* =================================================
           현재 공개할 페이지 수 계산
        ================================================= */

        function getVisibleCount() {

            const now =
                new Date();


            let count = 0;


            schedules.forEach(
                function(item) {

                    const openTime =
                        new Date(
                            item.time
                        );


                    if (
                        now >= openTime
                    ) {

                        count++;

                    }

                }
            );


            return count;

        }


        /* =================================================
           페이지 공개
        ================================================= */

        function updatePages() {

            const visibleCount =
                getVisibleCount();


            /*
             * 공개 시간이 된 페이지를
             * visible 상태로 변경
             */

            pages.forEach(
                function(page, index) {

                    if (
                        index <
                        visibleCount
                    ) {

                        page.classList.add(
                            "visible"
                        );

                    }

                    else {

                        page.classList.remove(
                            "visible"
                        );

                    }

                }
            );


            /*
             * 공개된 페이지 수에 맞게
             * 페이지 점도 표시
             */

            dots.forEach(
                function(dot, index) {

                    if (
                        index <
                        visibleCount
                    ) {

                        dot.style.display =
                            "block";

                    }

                    else {

                        dot.style.display =
                            "none";

                    }

                }
            );


            /*
             * 현재 위치가 새롭게 공개된
             * 페이지 때문에 이상해지는 것을 방지
             */

            updateActiveDot();

        }


        /* =================================================
           현재 페이지 표시
        ================================================= */

        function updateActiveDot() {

            const pageWidth =
                window.innerWidth;


            const currentPage =
                Math.round(
                    slider.scrollLeft
                    /
                    pageWidth
                );


            dots.forEach(
                function(dot, index) {

                    if (
                        index ===
                        currentPage
                    ) {

                        dot.classList.add(
                            "active"
                        );

                    }

                    else {

                        dot.classList.remove(
                            "active"
                        );

                    }

                }
            );

        }


        /* =================================================
           최초 실행
        ================================================= */

        updatePages();


        /* =================================================
           1초마다 시간 확인
        ================================================= */

        /*
         * setTimeout 한 번에 의존하지 않는다.
         *
         * 18:00이 되면 다음 확인에서
         * Sqn_2가 자동으로 추가된다.
         */

        setInterval(
            function() {

                updatePages();

            },
            1000
        );


        /* =================================================
           화면이 다시 활성화될 때
        ================================================= */

        /*
         * iPhone 화면 잠금
         * 다른 앱 이동
         * 카카오톡 인앱 브라우저
         * Safari 백그라운드
         *
         * 등의 상황을 대비한다.
         */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    updatePages();

                }

            }
        );


        /* =================================================
           페이지가 다시 나타날 때
        ================================================= */

        window.addEventListener(
            "pageshow",
            function() {

                updatePages();

            }
        );


        /* =================================================
           스크롤 감지
        ================================================= */

        slider.addEventListener(
            "scroll",
            function() {

                updateActiveDot();

            }
        );


        /* =================================================
           화면 크기가 변경될 때
        ================================================= */

        window.addEventListener(
            "resize",
            function() {

                updatePages();

            }
        );


    </script>


</body>

</html>
