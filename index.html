<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Our Special Day</title>


<style>

* {
    box-sizing:border-box;
}


html,
body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}


/* =========================
   슬라이드 영역
========================= */


.slider {

    width:100vw;

    height:100dvh;

    display:flex;

    overflow-x:auto;

    overflow-y:hidden;

    scroll-snap-type:x mandatory;

    scroll-behavior:smooth;

    -webkit-overflow-scrolling:touch;

    scrollbar-width:none;

}


.slider::-webkit-scrollbar {

    display:none;

}



/* =========================
   페이지
========================= */


.page {

    flex:0 0 100vw;

    width:100vw;

    height:100dvh;

    display:flex;

    justify-content:center;

    align-items:center;

    scroll-snap-align:start;

}



.page img {

    width:100%;

    height:100%;

    object-fit:contain;

    object-position:center;

}



/* =========================
   페이지 점
========================= */


.dots {

    position:fixed;

    left:50%;

    bottom:
    calc(
        25px +
        env(safe-area-inset-bottom)
    );

    transform:translateX(-50%);

    display:flex;

    gap:8px;

    z-index:100;

}



.dot {

    width:6px;

    height:6px;

    border-radius:50%;

    background:
    rgba(255,255,255,.4);

    transition:.3s;

}



.dot.active {

    background:white;

    transform:scale(1.3);

}


</style>


</head>



<body>


<main
class="slider"
id="slider">
</main>


<div
class="dots"
id="dots">
</div>




<script>


/* =================================================
   이미지 공개 일정
================================================= */


const schedules = [


{
    image:"Sqn_1.jpg",

    time:
    "2026-07-29T00:00:00+09:00",

    removeAt:
    "2026-07-29T10:00:00+09:00"
},


{
    image:"Sqn_2.jpg",

    time:
    "2026-07-29T10:00:00+09:00"
},


{
    image:"Sqn_3.jpg",

    time:
    "2026-07-29T11:00:00+09:00"
},


{
    image:"Sqn_4.jpg",

    time:
    "2026-07-29T12:00:00+09:00"
},


{
    image:"Sqn_5.jpg",

    time:
    "2026-07-29T13:00:00+09:00"
},


{
    image:"Sqn_6.jpg",

    time:
    "2026-07-29T14:00:00+09:00"
},


{
    image:"Sqn_7.jpg",

    time:
    "2026-07-29T15:00:00+09:00"
}


];





const slider =
document.getElementById("slider");


const dots =
document.getElementById("dots");





/* =================================================
   현재 표시할 이미지 계산
================================================= */


function getVisibleImages(){


    const now =
    new Date();


    return schedules.filter(
        function(item){


            const openTime =
            new Date(item.time);



            if(now < openTime){

                return false;

            }



            if(
                item.removeAt &&
                now >= new Date(item.removeAt)
            ){

                return false;

            }



            return true;


        }
    );


}





/* =================================================
   페이지 생성
================================================= */


function updatePages(){


    // 현재 위치 저장

    const currentScroll =
    slider.scrollLeft;



    const images =
    getVisibleImages();



    slider.innerHTML="";

    dots.innerHTML="";



    images.forEach(
        function(item,index){


            const page =
            document.createElement("section");


            page.className="page";



            const img =
            document.createElement("img");


            img.src =
            item.image;


            img.alt =
            "Page " + (index+1);



            page.appendChild(img);


            slider.appendChild(page);




            const dot =
            document.createElement("div");


            dot.className="dot";



            dots.appendChild(dot);



        }
    );



    /*
      이미지가 삭제/추가되어도
      가능한 위치 유지
    */

    if(
        slider.scrollWidth >= currentScroll
    ){

        slider.scrollLeft =
        currentScroll;

    }



    updateActiveDot();


}





/* =================================================
   현재 점 표시
================================================= */


function updateActiveDot(){


    const pageWidth =
    window.innerWidth;



    const currentPage =
    Math.round(
        slider.scrollLeft /
        pageWidth
    );



    const allDots =
    document.querySelectorAll(".dot");



    allDots.forEach(
        function(dot,index){


            if(
                index === currentPage
            ){

                dot.classList.add(
                    "active"
                );

            }

            else{

                dot.classList.remove(
                    "active"
                );

            }


        }
    );


}





/* =================================================
   이미지 미리 로딩
================================================= */


schedules.forEach(
function(item){


    const img =
    new Image();


    img.src =
    item.image;


});





/* =================================================
   최초 실행
================================================= */


updatePages();





/* =================================================
   시간 체크
================================================= */


setInterval(
function(){

    updatePages();

},
1000
);





/* =================================================
   스크롤 감지
================================================= */


slider.addEventListener(
"scroll",
function(){

    updateActiveDot();

});





/* =================================================
   화면 변경
================================================= */


window.addEventListener(
"resize",
function(){

    updatePages();

});





document.addEventListener(
"visibilitychange",
function(){


    if(
        document.visibilityState === "visible"
    ){

        updatePages();

    }


});



</script>


</body>

</html>
