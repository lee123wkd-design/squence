<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>A Special Invitation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #f5f0e8;
        }


        /* =========================
           스와이프 영역
        ========================= */

        .slider {

            width: 100vw;
            height: 100vh;

            display: flex;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: none;
        }


        .slider::-webkit-scrollbar {
            display: none;
        }


        /* =========================
           각각의 페이지
        ========================= */

        .page {

            flex: 0 0 100vw;

            width: 100vw;
            height: 100vh;

            scroll-snap-align: start;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================
           이미지
        ========================= */

        .page img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                opacity 0.8s ease-in-out;
        }


        /* =========================
           페이지 표시 점
        ========================= */

        .dots {

            position: fixed;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 8px;

            z-index: 100;
        }


        .dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.45);

            transition: all 0.3s ease;
        }


        .dot.active {

            background: white;

            transform: scale(1.3);
        }


        /* =========================
           스와이프 안내
        ========================= */

        .swipe-guide {

            position: fixed;

            bottom: 55px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-family: sans-serif;

            font-size: 12px;

            letter-spacing: 1px;

            opacity: 0.8;

            z-index: 100;

            animation:
                fadeGuide 3s ease forwards;
        }


        @keyframes fadeGuide {

            0% {
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            70% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         4페이지 모바일 초대장
    ================================== -->

    <main
        class="slider"
        id="slider">


        <!-- PAGE 1 : COVER -->

        <section class="page">

            <img
                src="Inv_1.jpg"
                alt="Cover">

        </section>


        <!-- PAGE 2 : STORY -->

        <section class="page">

            <img
                src="Inv_2.jpg"
                alt="Our Story">

        </section>


        <!-- PAGE 3 : SPECIAL MOMENT -->

        <section class="page">

            <img
                src="Inv_3.jpg"
                alt="Special Moment">

        </section>


        <!-- PAGE 4 : PROPOSAL -->

        <section class="page">

            <img
                id="proposalImage"

                src="Inv_4.jpg"

                alt="Proposal">

        </section>


    </main>


    <!-- =================================
         페이지 표시
    ================================== -->

    <div class="dots">

        <div class="dot active"></div>

        <div class="dot"></div>

        <div class="dot"></div>

        <div class="dot"></div>

    </div>


    <!-- =================================
         스와이프 안내
    ================================== -->

    <div class="swipe-guide">

        SWIPE →

    </div>


    <script>


        /* =================================================
           설정
        ================================================= */


        /*
           프로포즈 이미지가 변경되는 시각

           2026년 8월 1일 18:00
           한국시간 (UTC+9)
        */

        const changeTime =
            new Date(
                "2026-07-28T20:20:00+09:00"
            );


        /*
           이미지 파일 이름
        */

        const BEFORE_IMAGE =
            "Inv_4.jpg";

        const AFTER_IMAGE =
            "Inv_5.jpg";


        /*
           마지막 페이지 이미지 객체
        */

        const proposalImage =
            document.getElementById(
                "proposalImage"
            );


        /*
           마지막으로 적용한 상태

           "before"
           또는
           "after"
        */

        let currentState = null;



        /* =================================================
           AFTER 이미지 미리 로딩
        ================================================= */

        /*
           실제 18:00이 되었을 때
           이미지 로딩 때문에 늦어지는 것을
           방지하기 위해 미리 받아둔다.
        */

        const preloadedAfterImage =
            new Image();

        preloadedAfterImage.src =
            AFTER_IMAGE;



        /* =================================================
           이미지 변경 함수
        ================================================= */

        function setProposalImage(
            state
        ) {


            /*
               이미 현재 상태와 같다면
               아무것도 하지 않는다.
            */

            if (
                currentState === state
            ) {

                return;

            }


            /*
               이미지 변경 전에
               현재 상태 기록
            */

            currentState = state;



            /* =========================
               BEFORE
            ========================= */

            if (
                state === "before"
            ) {

                proposalImage.style.opacity =
                    "0";


                setTimeout(function() {

                    proposalImage.src =
                        BEFORE_IMAGE;

                    proposalImage.style.opacity =
                        "1";

                }, 300);


            }


            /* =========================
               AFTER
            ========================= */

            else {

                /*
                   미리 로딩된 이미지가
                   이미 준비되어 있다면
                   바로 변경
                */

                if (
                    preloadedAfterImage.complete
                ) {

                    proposalImage.style.opacity =
                        "0";


                    setTimeout(function() {

                        proposalImage.src =
                            AFTER_IMAGE;

                        proposalImage.style.opacity =
                            "1";

                    }, 300);

                }


                /*
                   아직 로딩 중이라면
                   로딩 완료 후 변경
                */

                else {

                    preloadedAfterImage.onload =
                        function() {

                            proposalImage.style.opacity =
                                "0";


                            setTimeout(function() {

                                proposalImage.src =
                                    AFTER_IMAGE;

                                proposalImage.style.opacity =
                                    "1";

                            }, 300);

                        };

                }

            }

        }



        /* =================================================
           현재 시간 확인
        ================================================= */

        function checkCurrentTime() {


            const now =
                new Date();


            /*
               변경 시간 이후
            */

            if (
                now >= changeTime
            ) {

                setProposalImage(
                    "after"
                );

            }


            /*
               변경 시간 이전
            */

            else {

                setProposalImage(
                    "before"
                );

            }

        }



        /* =================================================
           ① 페이지 최초 실행
        ================================================= */

        checkCurrentTime();



        /* =================================================
           ② 1초마다 시간 확인
        ================================================= */

        /*
           setTimeout 하나에 의존하지 않는다.

           브라우저가 타이머를 조금 지연시켜도
           다음 확인에서 현재 시간을 다시 판단한다.
        */

        setInterval(
            function() {

                checkCurrentTime();

            },
            1000
        );



        /* =================================================
           ③ 페이지가 다시 활성화될 때 확인
        ================================================= */

        /*
           다음과 같은 상황을 대비한다.

           - 화면 잠금
           - 다른 앱으로 이동
           - 카카오톡 인앱 브라우저
           - Safari 백그라운드
           - Chrome 백그라운드
        */

        document.addEventListener(
            "visibilitychange",
            function() {


                /*
                   다시 화면에 나타난 경우
                */

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    /*
                       현재 시간을
                       즉시 다시 확인
                    */

                    checkCurrentTime();

                }

            }
        );



        /* =================================================
           ④ 브라우저가 다시 활성화될 때
        ================================================= */

        /*
           iOS / Android에서
           페이지가 다시 foreground로
           돌아오는 상황을 추가로 처리
        */

        window.addEventListener(
            "pageshow",
            function() {

                checkCurrentTime();

            }
        );



        /* =================================================
           ⑤ 페이지가 숨겨지기 전에도 확인
        ================================================= */

        window.addEventListener(
            "pagehide",
            function() {

                checkCurrentTime();

            }
        );



        /* =================================================
           ⑥ 스와이프 페이지 표시
        ================================================= */

        const slider =
            document.getElementById(
                "slider"
            );


        const dots =
            document.querySelectorAll(
                ".dot"
            );


        slider.addEventListener(
            "scroll",
            function() {


                /*
                   현재 페이지 너비
                */

                const pageWidth =
                    window.innerWidth;


                /*
                   현재 페이지 계산
                */

                const currentPage =
                    Math.round(
                        slider.scrollLeft
                        /
                        pageWidth
                    );


                /*
                   현재 페이지에 해당하는
                   점만 활성화
                */

                dots.forEach(
                    function(
                        dot,
                        index
                    ) {


                        if (
                            index ===
                            currentPage
                        ) {

                            dot.classList.add(
                                "active"
                            );

                        }

                        else {

                            dot.classList.remove(
                                "active"
                            );

                        }

                    }
                );


                /*
                   마지막 페이지로 들어왔을 때
                   시간 다시 확인

                   혹시 브라우저가 백그라운드였다면
                   이 시점에 최신 상태를 반영한다.
                */

                if (
                    currentPage === 3
                ) {

                    checkCurrentTime();

                }

            }
        );


    </script>


</body>

</html>
